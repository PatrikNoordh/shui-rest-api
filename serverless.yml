org: ${file(./config.yml):org}
service: shui

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  iam:
    role: ${file(./config.yml):role}

functions:
  # Auth
  register:
    handler: functions/register/index.handler
    events:
      - httpApi:
          path: /auth/register
          method: POST
  login:
    handler: functions/login/index.handler
    events:
      - httpApi:
          path: /auth/login
          method: POST

  # Posts
  getPosts:
    handler: functions/getPosts/index.handler
    events:
      - httpApi:
          path: /posts
          method: GET
  getPost:
    handler: functions/getPost/index.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: GET
  createPost:
    handler: functions/createPost/index.handler
    events:
      - httpApi:
          path: /posts
          method: POST
  updatePost:
    handler: functions/updatePost/index.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: PUT
  deletePost:
    handler: functions/deletePost/index.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: DELETE

  # Comments
  getComments:
    handler: functions/getComments/index.handler
    events:
      - httpApi:
          path: /posts/{postId}/comments
          method: GET
  createComment:
    handler: functions/createComment/index.handler
    events:
      - httpApi:
          path: /posts/{postId}/comments
          method: POST
